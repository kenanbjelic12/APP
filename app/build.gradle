plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mojfilm.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mojfilm.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Potpisano debug ključem da se APK može odmah instalirati.
            // Za Google Play napravi vlastiti keystore (vidi README).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
