name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "sdk.dir=$SDK" > local.properties
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|warning:.*deprecat^|What went wrong|Exception" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Preimenuj APK
        run: cp app/build/outputs/apk/release/app-release.apk MojFilm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MojFilm-apk
          path: MojFilm.apk

      - name: Objavi za preuzimanje (Releases)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MojFilm 1.0.${{ github.run_number }}
          body: MojFilm Android aplikacija
          files: MojFilm.apk
          make_latest: true
